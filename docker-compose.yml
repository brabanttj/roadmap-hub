services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roadmap_hub
      POSTGRES_USER: roadmap_admin
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - roadmap-hub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap_admin -d roadmap_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roadmap-hub-db-data:
